<!DOCTYPE html>
<html>
<head>
    <title>Soccer Card Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        header {
            background: #181818;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .coins {
            font-size: 20px;
            font-weight: bold;
        }

        nav {
            background: #202020;
            padding: 15px;
            text-align: center;
        }

        nav button {
            margin: 5px;
        }

        button {
            background: white;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            transform: scale(1.03);
        }

        .page {
            padding: 30px;
            text-align: center;
        }

        .hidden {
            display: none;
        }


        /* =========================
           CARD GRID
        ========================= */

        .collection {
            display: grid;
            grid-template-columns: repeat(3, 190px);
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }


        /* =========================
           PLAYER CARD
        ========================= */

        .card {
            width: 190px;
            height: 280px;
            position: relative;

            padding: 18px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #383838,
                    #151515
                );

            border: 2px solid #555;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.5);

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow: hidden;
        }


        /* CARD TOP */

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }


        .rating {
            font-size: 38px;
            font-weight: bold;
        }


        .position {
            font-size: 15px;
            opacity: 0.8;
        }


        /* FLAG */

        .flag {
            font-size: 28px;
            margin-top: 5px;
        }


        /* PLAYER */

        .player-name {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }


        .team {
            font-size: 14px;
            opacity: 0.8;
        }


        /* PRICE */

        .price {
            color: #6cff7a;
            font-size: 16px;
            font-weight: bold;
        }


        /* DUPLICATE INDICATOR */

        .duplicate-count {

            position: absolute;

            top: 8px;
            right: 8px;

            width: 30px;
            height: 30px;

            background: #e53935;

            color: white;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: bold;

            font-size: 15px;

            border: 2px solid white;

        }


        /* MANAGE CARD */

        .manage-card {

            background: #202020;

            padding: 15px;

            border-radius: 12px;

            width: 230px;

            margin: 0 auto;

        }


        .manage-container {

            display: grid;

            grid-template-columns:
                repeat(3, 230px);

            justify-content: center;

            gap: 25px;

            margin-top: 30px;

        }


        .manage-card button {

            background: #e53935;

            color: white;

            margin-top: 10px;

        }


        /* RESPONSIVE */

        @media (max-width: 750px) {

            .collection {

                grid-template-columns:
                    repeat(2, 190px);

            }

            .manage-container {

                grid-template-columns:
                    repeat(2, 230px);

            }

        }


        @media (max-width: 500px) {

            .collection {

                grid-template-columns:
                    repeat(1, 190px);

            }

            .manage-container {

                grid-template-columns:
                    repeat(1, 230px);

            }

        }

    </style>
</head>


<body>


<header>

    <h1>⚽ Soccer Cards</h1>

    <div class="coins">

        💰 <span id="coins">
            20,000,000
        </span>

    </div>

</header>


<nav>

    <button onclick="showPage('home')">
        Home
    </button>

    <button onclick="showPage('packs')">
        Packs
    </button>

    <button onclick="showPage('collection')">
        Collection
    </button>

    <button onclick="showPage('manage')">
        Manage Cards
    </button>

</nav>


<!-- HOME -->

<div id="home" class="page">

    <h2>
        Welcome to Soccer Cards
    </h2>

    <p>
        Collect players, sell cards and build your dream team.
    </p>

    <button onclick="showPage('packs')">
        Open Packs
    </button>

</div>


<!-- PACKS -->

<div id="packs" class="page hidden">

    <h2>📦 Packs</h2>

    <p>
        Get a random player from anywhere in the world.
    </p>

    <h3>
        Random Player Pack
    </h3>

    <p>
        Cost: 💰 5,000,000
    </p>

    <button onclick="openPack()">
        Buy Random Card
    </button>

    <div id="newCard"></div>

</div>


<!-- COLLECTION -->

<div id="collection" class="page hidden">

    <h2>
        📚 My Collection
    </h2>

    <div
        id="collectionCards"
        class="collection">
    </div>

</div>


<!-- MANAGE -->

<div id="manage" class="page hidden">

    <h2>
        💼 Manage Cards
    </h2>

    <p>
        Sell cards for their transfer-market value.
    </p>

    <div
        id="manageCards"
        class="manage-container">
    </div>

</div>


<script>


/* =========================
   PLAYER DATABASE
========================= */

const players = [

    {
        name: "Lionel Messi",
        team: "Inter Miami",
        nation: "Argentina",
        flag: "🇦🇷",
        position: "RW",
        rating: 90,
        price: 50000000
    },

    {
        name: "Cristiano Ronaldo",
        team: "Al Nassr",
        nation: "Portugal",
        flag: "🇵🇹",
        position: "ST",
        rating: 89,
        price: 45000000
    },

    {
        name: "Kylian Mbappe",
        team: "Real Madrid",
        nation: "France",
        flag: "🇫🇷",
        position: "ST",
        rating: 91,
        price: 180000000
    },

    {
        name: "Jude Bellingham",
        team: "Real Madrid",
        nation: "England",
        flag: "🇬🇧",
        position: "CM",
        rating: 90,
        price: 150000000
    },

    {
        name: "Lamine Yamal",
        team: "Barcelona",
        nation: "Spain",
        flag: "🇪🇸",
        position: "RW",
        rating: 89,
        price: 120000000
    },

    {
        name: "Vinicius Junior",
        team: "Real Madrid",
        nation: "Brazil",
        flag: "🇧🇷",
        position: "LW",
        rating: 90,
        price: 160000000
    }

];


/* =========================
   PLAYER DATA
========================= */

let coins = 20000000;

let collection = [];


/* =========================
   PAGE SYSTEM
========================= */

function showPage(pageName) {

    document
        .getElementById("home")
        .classList.add("hidden");

    document
        .getElementById("packs")
        .classList.add("hidden");

    document
        .getElementById("collection")
        .classList.add("hidden");

    document
        .getElementById("manage")
        .classList.add("hidden");


    document
        .getElementById(pageName)
        .classList.remove("hidden");


    if (pageName === "collection") {

        displayCollection();

    }


    if (pageName === "manage") {

        displayManageCards();

    }

}


/* =========================
   COINS
========================= */

function updateCoins() {

    document
        .getElementById("coins")
        .textContent =
        coins.toLocaleString();

}


/* =========================
   OPEN PACK
========================= */

function openPack() {

    const packPrice = 5000000;


    if (coins < packPrice) {

        alert(
            "You don't have enough coins!"
        );

        return;

    }


    coins -= packPrice;


    const randomIndex =
        Math.floor(
            Math.random() *
            players.length
        );


    const player =
        players[randomIndex];


    collection.push(player);


    updateCoins();


    displayNewCard(player);

}


/* =========================
   DISPLAY NEW CARD
========================= */

function displayNewCard(player) {

    document
        .getElementById("newCard")
        .innerHTML = `

        <div class="card">

            <div class="card-top">

                <div>

                    <div class="rating">
                        ${player.rating}
                    </div>

                    <div class="position">
                        ${player.position}
                    </div>

                </div>

                <div class="flag">
                    ${player.flag}
                </div>

            </div>


            <div>

                <div class="player-name">
                    ${player.name}
                </div>

                <div class="team">
                    ${player.team}
                </div>

            </div>


            <div class="price">
                💰 ${formatMoney(player.price)}
            </div>

        </div>

    `;

}


/* =========================
   COLLECTION
========================= */

function displayCollection() {

    const container =
        document.getElementById(
            "collectionCards"
        );


    if (collection.length === 0) {

        container.innerHTML =
            "<p>You don't have any cards yet.</p>";

        return;

    }


    container.innerHTML = "";


    const grouped = {};


    collection.forEach(player => {

        if (!grouped[player.name]) {

            grouped[player.name] = {

                player: player,

                count: 0

            };

        }

        grouped[player.name].count++;

    });


    Object.values(grouped).forEach(data => {

        const player = data.player;

        const count = data.count;


        container.innerHTML += `

            <div class="card">

                ${
                    count > 1
                    ?
                    `<div class="duplicate-count">
                        ${count}
                    </div>`
                    :
                    ""
                }


                <div class="card-top">

                    <div>

                        <div class="rating">
                            ${player.rating}
                        </div>

                        <div class="position">
                            ${player.position}
                        </div>

                    </div>

                    <div class="flag">
                        ${player.flag}
                    </div>

                </div>


                <div>

                    <div class="player-name">
                        ${player.name}
                    </div>

                    <div class="team">
                        ${player.team}
                    </div>

                </div>


                <div class="price">
                    💰 ${formatMoney(player.price)}
                </div>

            </div>

        `;

    });

}


/* =========================
   MANAGE CARDS
========================= */

function displayManageCards() {

    const container =
        document.getElementById(
            "manageCards"
        );


    if (collection.length === 0) {

        container.innerHTML =
            "<p>You don't have any cards to manage.</p>";

        return;

    }


    container.innerHTML = "";


    const grouped = {};


    collection.forEach(player => {

        if (!grouped[player.name]) {

            grouped[player.name] = {

                player: player,

                count: 0

            };

        }

        grouped[player.name].count++;

    });


    Object.values(grouped).forEach(data => {

        const player = data.player;

        const count = data.count;


        container.innerHTML += `

            <div class="card">

                ${
                    count > 1
                    ?
                    `<div class="duplicate-count">
                        ${count}
                    </div>`
                    :
                    ""
                }


                <div class="card-top">

                    <div>

                        <div class="rating">
                            ${player.rating}
                        </div>

                        <div class="position">
                            ${player.position}
                        </div>

                    </div>

                    <div class="flag">
                        ${player.flag}
                    </div>

                </div>


                <div>

                    <div class="player-name">
                        ${player.name}
                    </div>

                    <div class="team">
                        ${player.team}
                    </div>

                </div>


                <div class="price">
                    💰 ${formatMoney(player.price)}
                </div>


                <button
                    onclick="sellCard('${player.name}')">

                    Sell Card

                </button>

            </div>

        `;

    });

}


/* =========================
   SELL CARD
========================= */

function sellCard(playerName) {

    const index =
        collection.findIndex(
            player =>
                player.name === playerName
        );


    if (index === -1) {

        return;

    }


    const player =
        collection[index];


    coins += player.price;


    collection.splice(index, 1);


    updateCoins();


    displayManageCards();


    displayCollection();


    alert(
        player.name +
        " sold for " +
        formatMoney(player.price)
    );

}


/* =========================
   MONEY FORMAT
========================= */

function formatMoney(amount) {

    return "$" +
        amount.toLocaleString();

}


/* =========================
   START
========================= */

updateCoins();

</script>

</body>
</html>
